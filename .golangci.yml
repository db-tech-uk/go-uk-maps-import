version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - godot
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  disable:
    - cyclop
    - dupl
    - exhaustruct
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - lll
    - maintidx
    - makezero
    - mnd
    - nestif
    - nlreturn
    - nonamedreturns
    - paralleltest
    - revive
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - err113
        text: do not define dynamic errors, use wrapped static errors instead
      - path: _test\.go
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    depguard:
      rules:
        Main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/db-tech-uk
            - github.com/DATA-DOG/go-sqlmock
            - github.com/go-sql-driver/mysql
            - github.com/jmoiron/sqlx
            - github.com/lib/pq
            - github.com/mattn/go-sqlite3
            - github.com/pbnjay/memory
            - github.com/schollz/sqlite3dump
            - github.com/twpayne/go-geos
            - golang.org/x/text
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go-uk-maps-import,github.com/db-tech-uk/go-uk-maps-import)
    goimports:
      local-prefixes:
        - go-uk-maps-import
        - github.com/db-tech-uk/go-uk-maps-import
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
